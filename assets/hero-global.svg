<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="55%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="goldTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="620" fill="url(#bgSky)"/>
  <circle cx="580" cy="170" r="260" fill="url(#sunGlow)"/>
  <!-- Subtle Honeycomb Architectural Grid -->
  <g stroke="#F59E0B" stroke-opacity="0.08" fill="none" stroke-width="1">
    <polygon points="120,60 170,90 170,150 120,180 70,150 70,90"/>
    <polygon points="220,60 270,90 270,150 220,180 170,150 170,90"/>
    <polygon points="170,150 220,180 220,240 170,270 120,240 120,180"/>
    <polygon points="640,90 690,120 690,180 640,210 590,180 590,120"/>
  </g>
