  <polygon points="560,70 572,180 585,520 535,520 548,180" fill="url(#goldTower)" opacity="0.9"/>
  <rect x="558" y="42" width="4" height="35" fill="#FDE68A"/>
  <!-- Luxury Lekki Waterfront Villa Complex -->
  <rect x="110" y="290" width="380" height="230" rx="6" fill="url(#glassFacade)" stroke="#78716C" stroke-width="1.5"/>
  <rect x="90" y="275" width="420" height="18" rx="3" fill="url(#goldTower)"/>
  <!-- Upper Penthouse Cantilever -->
  <rect x="160" y="205" width="290" height="70" rx="4" fill="#292524" stroke="#D97706" stroke-width="1.5"/>
  <rect x="145" y="193" width="320" height="14" rx="2" fill="#F59E0B"/>
  <!-- Illuminated Warm Interior Windows -->
  <rect x="180" y="220" width="110" height="42" rx="2" fill="#FEF3C7" fill-opacity="0.85"/>
  <rect x="315" y="220" width="115" height="42" rx="2" fill="#FDE68A" fill-opacity="0.75"/>
  <rect x="135" y="315" width="145" height="95" rx="3" fill="#FEF3C7" fill-opacity="0.8"/>
  <rect x="305" y="315" width="155" height="95" rx="3" fill="#FDE68A" fill-opacity="0.65"/>
  <!-- Window Mullions -->
  <line x1="207" y1="315" x2="207" y2="410" stroke="#1C1917" stroke-width="3"/>
  <line x1="382" y1="315" x2="382" y2="410" stroke="#1C1917" stroke-width="3"/>
  <!-- Infinity Pool Reflection -->
  <rect x="60" y="520" width="680" height="100" fill="#0C0A09"/>
  <rect x="100" y="535" width="480" height="42" rx="4" fill="#0F766E" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.4"/>
  <line x1="130" y1="550" x2="340" y2="550" stroke="#FDE68A" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="240" y1="564" x2="520" y2="564" stroke="#99F6E4" stroke-opacity="0.35" stroke-width="2"/>
